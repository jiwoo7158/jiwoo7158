name: GitHub-Profile-3D-Contrib

on:
  # 05:17 Korea Standard Time (KST) = 20:17 UTC on the previous day.
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

# Required to commit the generated SVG images back to this repository.
permissions:
  contents: write

# Avoid overlapping updates of the same generated files.
concurrency:
  group: profile-3d-contrib
  cancel-in-progress: false

jobs:
  build:
    name: Generate 3D contribution graph
    runs-on: ubuntu-latest
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (pinned)

      - name: Generate 3D contribution SVGs
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # latest branch snapshot (pinned)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit and push generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- profile-3d-contrib/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update 3D contribution graph"
            git push
          fi
